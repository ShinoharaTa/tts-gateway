openapi: 3.1.0
info:
  title: tts-gateway API
  version: 0.1.0
  summary: ZEN-TTS を使う TTS HTTP API
  description: |
    docs/api.md と同じ内容の機械可読な仕様。食い違いはバグ。

    - リクエスト本文は `application/json` のみ（それ以外は 415）。未知のフィールドは 400。
    - `TTS_TOKEN` を設定したときだけ、`/healthz` と設定画面（`/admin/`）以外で `Authorization: Bearer <TTS_TOKEN>` が必須。
      `/v1/admin/*` は `TTS_ADMIN_TOKEN` を設定したときだけその値が必須（未設定なら `TTS_TOKEN` の規則）。
    - `TTS_ALLOW_CIDRS` に入らない接続元は 403。CORS ヘッダは返さない。

    音声合成：ZEN-TTS（https://zenryokukikai.com ）。この API で作った音声を使う側でもクレジットの表示が必要。
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:8710
    description: 既定（TTS_HOSTS=127.0.0.1、TTS_PORT=8710）
security:
  - {}
  - bearerAuth: []
tags:
  - name: synthesis
    description: 合成と読み
  - name: admin
    description: 設定画面が使う管理 API
  - name: health
    description: 死活確認
paths:
  /healthz:
    get:
      operationId: getHealth
      tags: [health]
      summary: 死活確認（モデルを読まずに返す。認証不要）
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/engines:
    get:
      operationId: listEngines
      tags: [synthesis]
      summary: エンジン・声・対応オプションの一覧
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnginesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/synthesize:
    post:
      operationId: synthesize
      tags: [synthesis]
      summary: テキストを音声にする
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SynthesizeRequest'
      responses:
        '200':
          description: 音声
          headers:
            X-Engine:
              description: 使ったエンジン
              schema:
                type: string
                examples: [zen-tts]
            X-Voice:
              description: 使った声
              schema:
                type: string
                examples: [marine]
            X-Audio-Duration-Ms:
              description: 音声の長さ（ms）
              schema:
                type: integer
                minimum: 0
            X-Sample-Rate:
              description: 出力のサンプルレート（opus で 44100・22050 を指定したときは 48000）
              schema:
                type: integer
                enum: [8000, 16000, 22050, 24000, 44100, 48000]
            X-Cache:
              description: キャッシュ
              schema:
                type: string
                enum: [hit, miss, bypass]
            X-Synthesis-Ms:
              description: 合成にかかった時間（hit なら 0）
              schema:
                type: integer
                minimum: 0
            X-TTS-Credit:
              description: 帰属表示（URL エンコード）。この音声を使う側でも表示が必要
              schema:
                type: string
                examples: ['Speech%20synthesis%3A%20ZEN-TTS%20(https%3A%2F%2Fzenryokukikai.com)']
            ETag:
              description: キャッシュキー（`"<sha256>"`）
              schema:
                type: string
          content:
            audio/wav:
              schema:
                $ref: '#/components/schemas/Audio'
            audio/mpeg:
              schema:
                $ref: '#/components/schemas/Audio'
            audio/ogg:
              schema:
                $ref: '#/components/schemas/Audio'
            audio/mp4:
              schema:
                $ref: '#/components/schemas/Audio'
            audio/flac:
              schema:
                $ref: '#/components/schemas/Audio'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TextTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ModelNotInstalled'
        '429':
          $ref: '#/components/responses/QueueFull'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/EngineUnavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/normalize:
    post:
      operationId: normalize
      tags: [synthesis]
      summary: 合成せずに、前処理と読み辞書を通した後の文を返す
      description: リクエストは /v1/synthesize と同じ（音声関係のフィールドも検証する）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SynthesizeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NormalizeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/TextTooLong'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /v1/dictionary:
    get:
      operationId: getDictionary
      tags: [synthesis]
      summary: 読み辞書（組み込み + ユーザー追加）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/status:
    get:
      operationId: getStatus
      tags: [admin]
      summary: サーバーの状態
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/settings:
    get:
      operationId: getSettings
      tags: [admin]
      summary: 画面から変えられる設定
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: updateSettings
      tags: [admin]
      summary: 設定の部分更新（送ったキーだけ変える）。更新後の全体を返す
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      responses:
        '200':
          description: 更新後の設定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /v1/admin/catalog:
    get:
      operationId: getCatalog
      tags: [admin]
      summary: 追加できる公式モデルの一覧（catalog/*.json）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/models:
    get:
      operationId: listModels
      tags: [admin]
      summary: 登録済みモデルと状態
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: addModel
      tags: [admin]
      summary: モデルを登録し、ダウンロードを始める（非同期）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelAddRequest'
      responses:
        '202':
          description: 登録した。状態は GET /v1/admin/models で見る
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /v1/admin/models/{engine}/{id}/download:
    post:
      operationId: redownloadModel
      tags: [admin]
      summary: pending / error のモデルを取り直す
      parameters:
        - $ref: '#/components/parameters/Engine'
        - $ref: '#/components/parameters/ModelId'
      responses:
        '202':
          description: 取り直しを始めた
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /v1/admin/models/{engine}/{id}:
    delete:
      operationId: deleteModel
      tags: [admin]
      summary: 登録と重みのファイルを消す（ダウンロード中なら中止して消す）
      parameters:
        - $ref: '#/components/parameters/Engine'
        - $ref: '#/components/parameters/ModelId'
      responses:
        '204':
          description: 消した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /v1/admin/dictionary/{surface}:
    parameters:
      - name: surface
        in: path
        required: true
        description: 語（URL エンコード）
        schema:
          type: string
          minLength: 1
          maxLength: 100
    put:
      operationId: putReading
      tags: [admin]
      summary: ユーザー辞書の語を追加・更新する（組み込みの語ならユーザー辞書の値で上書き）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingPut'
      responses:
        '200':
          description: 更新後の辞書
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    delete:
      operationId: deleteReading
      tags: [admin]
      summary: ユーザー辞書の語を消す（組み込みの語は 404）
      responses:
        '200':
          description: 更新後の辞書
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /v1/admin/cache:
    delete:
      operationId: clearCache
      tags: [admin]
      summary: 音声キャッシュを全部消す
      responses:
        '204':
          description: 消した
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: TTS_TOKEN（/v1/admin/* は TTS_ADMIN_TOKEN があればその値）。どちらも未設定なら不要
  parameters:
    Engine:
      name: engine
      in: path
      required: true
      schema:
        type: string
        examples: [zen-tts]
    ModelId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
  responses:
    BadRequest:
      description: パラメータ不正（範囲外・型違い・未知のフィールド・そのエンジンが対応しないオプション）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: トークンが無い・違う
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 接続元が許可リスト外
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: エンジン・声・モデル・パスが無い
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 同じ id のモデルがある・ダウンロード中・既定の声 など
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TextTooLong:
      description: text が上限（TTS_MAX_CHARS、既定 2,000 字）を超えた
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: JSON 以外の本文
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ModelNotInstalled:
      description: 声は登録済みだが重みが未取得
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    QueueFull:
      description: 待ち行列が満杯
      headers:
        Retry-After:
          description: 再試行までの秒数
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: 想定外の失敗
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EngineUnavailable:
      description: モデル読み込み・合成プロセスの失敗
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Timeout:
      description: 合成が時間内（TTS_TIMEOUT_SEC、既定 60 秒）に終わらなかった
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Audio:
      type: string
      format: binary
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - unauthorized
                - forbidden
                - not_found
                - conflict
                - text_too_long
                - unsupported_media_type
                - model_not_installed
                - queue_full
                - internal_error
                - engine_unavailable
                - timeout
            message:
              type: string
            field:
              type: string
              description: 問題のフィールド（入れ子は `zenTts.speed` の形）
      examples:
        - error: { code: invalid_request, message: speed must be between 0.5 and 1.5, field: zenTts.speed }
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          examples: [0.1.0]
    Credit:
      type: object
      additionalProperties: false
      required: [ja, en, url]
      properties:
        ja:
          type: string
          examples: ['音声合成：ZEN-TTS（https://zenryokukikai.com）']
        en:
          type: string
          examples: ['Speech synthesis: ZEN-TTS (https://zenryokukikai.com)']
        url:
          type: string
          format: uri
    Voice:
      type: object
      additionalProperties: false
      required: [id, name, installed, default]
      properties:
        id:
          type: string
        name:
          type: string
        installed:
          type: boolean
        default:
          type: boolean
    Engine:
      type: object
      additionalProperties: false
      required: [id, name, version, credit, sampleRate, voices, options]
      properties:
        id:
          type: string
          examples: [zen-tts]
        name:
          type: string
          examples: [ZEN-TTS]
        version:
          type: string
          examples: [1.3.0]
        credit:
          $ref: '#/components/schemas/Credit'
        sampleRate:
          type: integer
          examples: [44100]
        voices:
          type: array
          items:
            $ref: '#/components/schemas/Voice'
        options:
          type: array
          description: 固有オプション（zenTts など）のキー
          items:
            type: string
          examples:
            - [emotion, change, strength, speed, pitch, latin, numbers, accentDict, accentSettings]
        emotions:
          type: array
          items:
            $ref: '#/components/schemas/EmotionName'
        curves:
          type: array
          items:
            $ref: '#/components/schemas/Curve'
    EnginesResponse:
      type: object
      additionalProperties: false
      required: [default, engines]
      properties:
        default:
          type: object
          additionalProperties: false
          required: [engine, voice]
          properties:
            engine:
              type: string
            voice:
              type: [string, 'null']
        engines:
          type: array
          items:
            $ref: '#/components/schemas/Engine'
    EmotionName:
      type: string
      enum: [neutral, happy, sad, angry, apologetic]
    Curve:
      type: string
      enum: [ease, linear, fast-start, late-surge, switch, steps, hill, valley, wave]
    EmotionAmounts:
      type: object
      description: 感情の比率（0 以上。比だけが効く）。全部 0 または省略は neutral
      additionalProperties: false
      properties:
        neutral:
          type: number
          minimum: 0
        happy:
          type: number
          minimum: 0
        sad:
          type: number
          minimum: 0
        angry:
          type: number
          minimum: 0
        apologetic:
          type: number
          minimum: 0
      examples:
        - { happy: 70, neutral: 30 }
    EmotionChange:
      type: object
      description: 文の途中で感情を変える（from < until）
      additionalProperties: false
      required: [to]
      properties:
        to:
          $ref: '#/components/schemas/EmotionAmounts'
        curve:
          $ref: '#/components/schemas/Curve'
        from:
          type: number
          minimum: 0
          maximum: 1
          default: 0
        until:
          type: number
          minimum: 0
          maximum: 1
          default: 1
    AccentDictEntry:
      type: object
      description: ZEN-TTS README「辞書の形式」と同じ
      additionalProperties: false
      required: [surface, reading]
      properties:
        surface:
          type: string
          minLength: 1
        reading:
          type: string
          description: カタカナかひらがな
          pattern: '^[\p{Script=Katakana}\p{Script=Hiragana}ー]+$'
        accent:
          type: integer
          minimum: 0
          maximum: 100
          description: アクセント型（0 = 平板、1 = 頭高）
        phrase:
          type: string
          enum: [split, join]
        strength:
          type: number
          minimum: 0
          maximum: 2
        contour:
          type: array
          items:
            type: number
            minimum: -3
            maximum: 3
        pitch:
          type: array
          description: 拍ごとに足す高さ（半音）
          items:
            type: number
            minimum: -24
            maximum: 24
        length:
          type: array
          description: 拍ごとの長さの倍率
          items:
            type: number
            minimum: 0.1
            maximum: 10
        note:
          type: string
    AccentSettings:
      type: object
      additionalProperties: false
      required: [accentHeight]
      properties:
        accentHeight:
          type: number
          minimum: -24
          maximum: 24
        pitchRange:
          type: array
          description: 感情ごとの声の幅（半音、neutral happy sad angry apologetic の順）
          minItems: 5
          maxItems: 5
          items:
            type: number
            minimum: 0
            maximum: 48
    ZenTtsOptions:
      type: object
      description: ZEN-TTS 固有のオプション。engine が zen-tts 以外なら 400
      additionalProperties: false
      properties:
        emotion:
          $ref: '#/components/schemas/EmotionAmounts'
        change:
          $ref: '#/components/schemas/EmotionChange'
        strength:
          type: number
          minimum: 0
          maximum: 2
          default: 1
        speed:
          type: number
          minimum: 0.5
          maximum: 1.5
          default: 1
        pitch:
          type: number
          minimum: -6
          maximum: 12
          default: 0
        latin:
          type: boolean
          default: true
        numbers:
          type: string
          enum: [rule, model]
          default: rule
        accentDict:
          type: array
          maxItems: 100
          default: []
          items:
            $ref: '#/components/schemas/AccentDictEntry'
        accentSettings:
          $ref: '#/components/schemas/AccentSettings'
    SynthesizeRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: 読む文章（上限は TTS_MAX_CHARS、既定 2,000 字）。改行・「。！？」で文に分けて順に合成する
        engine:
          type: string
          description: GET /v1/engines の id（既定は設定の defaultEngine）
        voice:
          type: string
          description: voices[].id（既定はエンジンの既定の声）
        format:
          type: string
          enum: [wav, mp3, opus, m4a, flac]
          default: wav
        sampleRate:
          type: integer
          enum: [8000, 16000, 22050, 24000, 44100, 48000]
          description: 出力のサンプルレート（既定はエンジンの値）。opus で 44100・22050 は 48000 で書く
        bitrate:
          type: string
          pattern: '^(1[6-9]|[2-9][0-9]|[12][0-9]{2}|3[01][0-9]|320)k$'
          description: 圧縮形式のビットレート（既定 mp3 128k / opus 48k / m4a 64k）。wav・flac では指定すると 400
        volume:
          type: number
          minimum: -20
          maximum: 12
          default: 0
          description: 音量の増減（dB）。±1 に丸める
        sentencePauseMs:
          type: integer
          minimum: 0
          maximum: 3000
          default: 250
        leadingSilenceMs:
          type: integer
          minimum: 0
          maximum: 3000
          default: 0
        trailingSilenceMs:
          type: integer
          minimum: 0
          maximum: 3000
          default: 0
        trimSilence:
          type: boolean
          default: true
        maxSentenceChars:
          type: integer
          minimum: 20
          maximum: 120
          default: 120
          description: 1 文の最大字数。超える文は読点・空白で分ける。ZEN-TTS で speed < 1 のときは 120 × speed 字が上限になる
        preprocess:
          type: boolean
          default: true
        dictionary:
          type: boolean
          default: true
        readings:
          type: object
          description: この要求だけの読み辞書の追加・上書き（最大 200 語。読みはカタカナ）
          maxProperties: 200
          default: {}
          propertyNames:
            minLength: 1
            maxLength: 100
          additionalProperties:
            type: string
            pattern: '^[\p{Script=Katakana}ー・ ]+$'
        cache:
          type: boolean
          default: true
        zenTts:
          $ref: '#/components/schemas/ZenTtsOptions'
      examples:
        - text: GitHub に Claude のコードを push しました。
          voice: marine
          format: mp3
          zenTts: { speed: 1.1, emotion: { happy: 60, neutral: 40 } }
    Hit:
      type: object
      additionalProperties: false
      required: [surface, reading]
      properties:
        surface:
          type: string
          description: 照合のキー（NFKC・小文字）
        reading:
          type: string
    UnknownWord:
      type: object
      additionalProperties: false
      required: [word, count]
      properties:
        word:
          type: string
        count:
          type: integer
          minimum: 1
    NormalizeResponse:
      type: object
      additionalProperties: false
      required: [text, spoken, sentences, hits, unknownWords]
      properties:
        text:
          type: string
        spoken:
          type: string
        sentences:
          type: array
          items:
            type: string
        hits:
          type: array
          items:
            $ref: '#/components/schemas/Hit'
        unknownWords:
          type: array
          description: 辞書に無い、小文字を含む英単語（多い順）
          items:
            $ref: '#/components/schemas/UnknownWord'
    DictionaryEntry:
      type: object
      additionalProperties: false
      required: [surface, reading, source]
      properties:
        surface:
          type: string
        reading:
          type: string
        source:
          type: string
          enum: [builtin, user]
    DictionaryResponse:
      type: object
      additionalProperties: false
      required: [version, entries]
      properties:
        version:
          type: string
          description: 置き換えに使う読みの sha256
          pattern: '^[0-9a-f]{64}$'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DictionaryEntry'
    ReadingPut:
      type: object
      additionalProperties: false
      required: [reading]
      properties:
        reading:
          type: string
          pattern: '^[\p{Script=Katakana}ー・ ]+$'
    EngineStatus:
      type: object
      additionalProperties: false
      required: [id, loaded, kernel, process, idleUnloadSec]
      properties:
        id:
          type: string
        loaded:
          type: [string, 'null']
          description: 読み込み中の声
        kernel:
          type: [string, 'null']
          examples: [wasm]
        process:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [pid, rssBytes]
              properties:
                pid:
                  type: integer
                rssBytes:
                  type: [integer, 'null']
        idleUnloadSec:
          type: integer
    Status:
      type: object
      additionalProperties: false
      required: [version, uptimeSec, engines, queue, cache, memory]
      properties:
        version:
          type: string
        uptimeSec:
          type: integer
          minimum: 0
        engines:
          type: array
          items:
            $ref: '#/components/schemas/EngineStatus'
        queue:
          type: object
          additionalProperties: false
          required: [running, waiting, max, concurrency]
          properties:
            running:
              type: integer
            waiting:
              type: integer
            max:
              type: integer
            concurrency:
              type: integer
              minimum: 1
              maximum: 2
        cache:
          type: object
          additionalProperties: false
          required: [entries, bytes, maxBytes]
          properties:
            entries:
              type: integer
            bytes:
              type: integer
            maxBytes:
              type: integer
        memory:
          type: object
          additionalProperties: false
          required: [rssBytes]
          properties:
            rssBytes:
              type: integer
    Settings:
      type: object
      additionalProperties: false
      required: [defaultEngine, defaultVoices, idleUnloadSec, cacheMaxMB, cacheTtlDays]
      properties:
        defaultEngine:
          type: string
          default: zen-tts
        defaultVoices:
          type: object
          description: エンジン id → 既定の声
          additionalProperties:
            type: string
          default: { zen-tts: marine }
        idleUnloadSec:
          type: integer
          description: 0（解放しない）または 60〜86400
          minimum: 0
          maximum: 86400
          default: 600
        cacheMaxMB:
          type: integer
          description: 0 はキャッシュ無効
          minimum: 0
          maximum: 10000
          default: 500
        cacheTtlDays:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
    SettingsPatch:
      type: object
      description: 送ったキーだけ変える。defaultVoices の声はインストール済みであること（でなければ 400）
      additionalProperties: false
      properties:
        defaultEngine:
          type: string
        defaultVoices:
          type: object
          additionalProperties:
            type: string
        idleUnloadSec:
          type: integer
          description: 0（解放しない）または 60〜86400
          minimum: 0
          maximum: 86400
        cacheMaxMB:
          type: integer
          minimum: 0
          maximum: 10000
        cacheTtlDays:
          type: integer
          minimum: 1
          maximum: 365
    CatalogModel:
      type: object
      additionalProperties: false
      required: [engine, id, name, url, sha256, bytes, registered]
      properties:
        engine:
          type: string
        id:
          type: string
        name:
          type: string
        url:
          type: string
          format: uri
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
        bytes:
          type: integer
        registered:
          type: boolean
    CatalogResponse:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/CatalogModel'
    Model:
      type: object
      additionalProperties: false
      required: [engine, id, name, source, status, bytes, progress, error, addedAt]
      properties:
        engine:
          type: string
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
        name:
          type: string
        source:
          type: object
          additionalProperties: false
          required: [url, sha256]
          properties:
            url:
              type: string
              format: uri
            sha256:
              type: [string, 'null']
              pattern: '^[0-9a-f]{64}$'
        status:
          type: string
          enum: [pending, downloading, verifying, installed, error]
        bytes:
          type: [integer, 'null']
        progress:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              required: [receivedBytes, totalBytes]
              properties:
                receivedBytes:
                  type: integer
                totalBytes:
                  type: [integer, 'null']
        error:
          type: [string, 'null']
        addedAt:
          type: string
          format: date-time
    ModelsResponse:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          items:
            $ref: '#/components/schemas/Model'
    ModelAddRequest:
      oneOf:
        - $ref: '#/components/schemas/ModelAddByUrl'
        - $ref: '#/components/schemas/ModelAddByCatalog'
    ModelAddByUrl:
      type: object
      additionalProperties: false
      required: [engine, id, url]
      properties:
        engine:
          type: string
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9_-]{0,31}$'
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: 省略時は id
        url:
          type: string
          format: uri
          pattern: '^https://'
          description: ホストは TTS_MODEL_HOSTS のどれか、またはそのサブドメイン（リダイレクト先も同じ）
        sha256:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: 省略したら取得したファイルの値を記録する
    ModelAddByCatalog:
      type: object
      additionalProperties: false
      required: [engine, catalog]
      properties:
        engine:
          type: string
        catalog:
          type: string
          description: catalog/*.json の id
